    <text x="76" y="245" font-size="27" fill="#c3d0dc">AI / ML &amp; backend engineering</text>
    <text x="76" y="292" font-size="21" fill="#adbfcc">Language models. Agent systems.</text>
    <text x="76" y="323" font-size="21" fill="#adbfcc">The backend behind them.</text>
    <text x="770" y="99" font-size="14" letter-spacing="2" fill="#adbfcc">FROM SIGNAL TO SYSTEM</text>
