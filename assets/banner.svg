<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Bharath B — AI / ML and backend engineering</title>
  <desc id="desc">A dark engineering notebook banner with a memory-and-evidence pipeline illustration.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a7d8de" stroke-opacity=".075"/></pattern>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#101c29"/><stop offset="1" stop-color="#142a33"/></linearGradient>
    <linearGradient id="flow"><stop stop-color="#75ddd0"/><stop offset="1" stop-color="#86aaff"/></linearGradient>
  </defs>
