    <g fill="#142c35" stroke="#75ddd0" stroke-width="2"><circle cx="770" cy="196" r="16"/><circle cx="770" cy="250" r="16"/></g>
    <g fill="#192b44" stroke="#86aaff" stroke-width="2"><circle cx="1032" cy="196" r="16"/><circle cx="1032" cy="250" r="16"/></g>
